<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden One — Управление устройствами</title>
<style>
  :root{
    --bg:#0b0e13; --panel:#12161e; --panel-2:#161b25; --panel-3:#1c2230;
    --border:#212734; --border-2:#2c3444;
    --text:#d7dde8; --muted:#8791a3; --faint:#5a6474;
    --cy:#4fd1c5; --cy-dim:#2b9c92; --cy-soft:rgba(79,209,197,.13);
    --steel:#5eb0ef; --steel-soft:rgba(94,176,239,.13);
    --green:#37d39b; --green-soft:rgba(55,211,155,.14);
    --amber:#f2b338; --amber-soft:rgba(242,179,56,.14);
    --red:#f2555c; --red-soft:rgba(242,85,92,.15);
    --radius:10px; --radius-sm:8px;
    --shadow:0 12px 40px rgba(0,0,0,.5);
    --mono:'SF Mono',ui-monospace,Menlo,Consolas,'Roboto Mono',monospace;
    --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  :root[data-theme="light"]{
    --bg:#eef1f5; --panel:#ffffff; --panel-2:#f5f7fa; --panel-3:#eaeef3;
    --border:#dfe4ec; --border-2:#cfd6e1;
    --text:#141a24; --muted:#586274; --faint:#8b95a6;
    --cy:#0e9c8f; --cy-dim:#0b7c72; --cy-soft:rgba(14,156,143,.12);
    --steel:#2f74c4; --steel-soft:rgba(47,116,196,.1);
    --shadow:0 12px 40px rgba(20,25,40,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
  ::selection{background:var(--cy-soft)}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:6px}
  svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .app{display:grid;grid-template-columns:78px 1fr;min-height:100vh}

  /* ── Icon rail ── */
  .rail{background:#0e1219;border-right:1px solid var(--border);display:flex;flex-direction:column;
    align-items:center;padding:16px 0;position:sticky;top:0;height:100vh;gap:4px}
  :root[data-theme="light"] .rail{background:#f6f8fb}
  .mk{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--cy),var(--cy-dim));
    display:grid;place-items:center;color:#04211e;font-weight:800;font-size:15px;margin-bottom:16px;flex-shrink:0}
  .ri{width:58px;padding:9px 0;border-radius:11px;display:flex;flex-direction:column;align-items:center;gap:5px;
    color:var(--faint);font-size:9.5px;font-weight:600;letter-spacing:.2px;transition:.14s;position:relative}
  .ri svg{width:19px;height:19px}
  .ri:hover{color:var(--text);background:var(--panel-2)}
  .ri.on{background:var(--cy-soft);color:var(--cy)}
  .ri .bg{position:absolute;top:4px;right:8px;background:var(--red);color:#fff;font-size:9px;font-weight:800;
    min-width:15px;height:15px;border-radius:20px;display:grid;place-items:center;padding:0 3px}
  .rail-foot{margin-top:auto}
  .uav{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#2c3444,#1c2230);
    display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--text)}

  /* ── Main ── */
  .main{display:flex;flex-direction:column;min-width:0}
  .top{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--border);
    background:var(--bg);position:sticky;top:0;z-index:20}
  .pt{font-size:16px;font-weight:700;letter-spacing:.2px}
  .crumb{font-size:11.5px;color:var(--faint);margin-top:1px}
  .srch{margin-left:12px;flex:1;max-width:320px;position:relative}
  .srch input{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);
    padding:8px 12px 8px 32px;border-radius:var(--radius-sm);font-size:12.5px;outline:none;font-family:var(--mono)}
  .srch input::placeholder{color:var(--faint)}
  .srch input:focus{border-color:var(--cy-dim);box-shadow:0 0 0 3px var(--cy-soft)}
  .srch svg{position:absolute;left:10px;top:8px;width:15px;height:15px;color:var(--faint)}
  .live{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);font-weight:600}
  .lb{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .seg{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
  .seg button{padding:6px 10px;font-size:11.5px;font-weight:700;color:var(--faint)}
  .seg button.on{background:var(--cy-soft);color:var(--cy)}
  .ibtn{width:33px;height:31px;border-radius:7px;border:1px solid var(--border);display:grid;place-items:center;color:var(--muted)}
  .ibtn:hover{color:var(--text);border-color:var(--border-2)}
  .ibtn svg{width:16px;height:16px}
  .content{padding:16px 22px;flex:1;display:flex;flex-direction:column;gap:14px}

  /* ── KPI ── */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--steel)}
  .kpi.g::before{background:var(--green)} .kpi.a::before{background:var(--amber)} .kpi.r::before{background:var(--red)}
  .kl{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);font-weight:600;padding-left:9px}
  .kv{font-size:27px;font-weight:750;letter-spacing:-.5px;padding-left:9px;margin-top:4px}
  .kd{font-size:11px;color:var(--muted);padding-left:9px;margin-top:3px}

  /* ── Panels / grid ── */
  .row{display:grid;grid-template-columns:1.65fr 1fr;gap:14px}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .ph{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
  .ph h3{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .ph h3 span{color:var(--faint);margin-left:6px;font-weight:600}
  .lnk{color:var(--cy);font-size:12px;font-weight:700}

  /* ── Table ── */
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);font-weight:600;padding:9px 16px}
  td{padding:11px 16px;border-top:1px solid var(--border);font-size:12.5px}
  tbody tr{cursor:pointer;transition:.1s}
  tbody tr:hover{background:var(--panel-2)}
  .cn{font-weight:650}.cm{font-size:11px;color:var(--faint)}
  .over{font-weight:700;color:var(--amber)}.over.hi{color:var(--red)}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap}
  .badge .dot{width:5px;height:5px;border-radius:50%}
  .b-green{background:var(--green-soft);color:var(--green)}.b-green .dot{background:var(--green)}
  .b-amber{background:var(--amber-soft);color:var(--amber)}.b-amber .dot{background:var(--amber)}
  .b-red{background:var(--red-soft);color:var(--red)}.b-red .dot{background:var(--red)}
  .b-steel{background:var(--steel-soft);color:var(--steel)}.b-steel .dot{background:var(--steel)}
  .b-gray{background:var(--panel-3);color:var(--muted)}.b-gray .dot{background:var(--faint)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:9px;
    font-size:12.5px;font-weight:700;transition:.14s;border:1px solid transparent;letter-spacing:.2px}
  .btn svg{width:15px;height:15px}
  .btn-cy{background:linear-gradient(135deg,var(--cy),var(--cy-dim));color:#04211e}
  .btn-cy:hover{filter:brightness(1.08)}
  .btn-red{background:var(--red);color:#fff}.btn-red:hover{filter:brightness(1.08)}
  .btn-ghost{background:var(--panel-2);border-color:var(--border);color:var(--text)}
  .btn-ghost:hover{border-color:var(--border-2);background:var(--panel-3)}

  /* ── Feed ── */
  .feed{display:flex;flex-direction:column}
  .ev{display:flex;gap:11px;padding:11px 16px;border-top:1px solid var(--border)}
  .ev:first-child{border-top:none}
  .ev-ico{width:28px;height:28px;border-radius:7px;flex-shrink:0;display:grid;place-items:center}
  .ev-ico svg{width:14px;height:14px}
  .ev-txt{font-size:12.5px}.ev-time{font-size:11px;color:var(--faint);margin-top:1px}

  /* ── Toolbar / chips ── */
  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .chip{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel);font-size:12px;font-weight:600;color:var(--muted)}
  .chip:hover{color:var(--text)}.chip.on{background:var(--cy-soft);color:var(--cy);border-color:transparent}

  /* ── Detail ── */
  .detail{display:grid;grid-template-columns:1fr 320px;gap:14px}
  .hero{display:flex;gap:16px;align-items:center;padding:18px 20px}
  .phone{width:50px;height:78px;border-radius:11px;flex-shrink:0;border:2px solid var(--border-2);background:var(--panel-2);position:relative}
  .phone::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:20px;height:4px;border-radius:3px;background:var(--border-2)}
  .field{padding:11px 20px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px}
  .field-l{font-size:12px;color:var(--muted)}.field-v{font-size:12.5px;font-weight:650;text-align:right}
  .acard{padding:16px 18px}.acard h4{font-size:13px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
  .acard p{font-size:12px;color:var(--muted);margin-bottom:14px}
  .alist{display:flex;flex-direction:column;gap:8px}.alist .btn{width:100%}
  .alist .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

  /* ── Lost preview ── */
  .lost{background:#05070a;border:1px solid #1b212c;border-radius:11px;padding:20px;text-align:center;margin-bottom:14px}
  .lost .lk{width:24px;height:24px;margin:0 auto 9px;color:#fff;opacity:.85}
  .lost .lt{color:#fff;font-size:13px;font-weight:650;margin-bottom:6px}
  .lost .lm{color:#aeb6c4;font-size:11.5px;line-height:1.5}.lost .lp{color:var(--cy);font-weight:750;margin-top:9px}

  /* ── Modal ── */
  .overlay{position:fixed;inset:0;background:rgba(4,6,10,.7);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:100;padding:20px}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;width:100%;max-width:440px;box-shadow:var(--shadow);overflow:hidden;animation:pop .16s ease}
  @keyframes pop{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-h{padding:18px 20px 0;display:flex;gap:12px;align-items:flex-start}
  .modal-ico{width:40px;height:40px;border-radius:10px;flex-shrink:0;display:grid;place-items:center}
  .modal-ico svg{width:20px;height:20px}
  .modal-h h3{font-size:15px}.modal-h p{font-size:12.5px;color:var(--muted);margin-top:2px}
  .modal-b{padding:16px 20px}
  .form-row{margin-bottom:12px}
  .form-row label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .form-row input,.form-row select,.form-row textarea{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:8px;font-size:13px;outline:none;font-family:inherit}
  .form-row textarea{resize:vertical;min-height:60px}
  .form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--cy-dim);box-shadow:0 0 0 3px var(--cy-soft)}
  .modal-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end;background:var(--panel-2)}
  .warn{display:flex;gap:9px;padding:10px 12px;border-radius:9px;background:var(--amber-soft);font-size:12px;color:var(--amber);margin-bottom:14px;align-items:flex-start}
  .warn svg{width:15px;height:15px;flex-shrink:0;margin-top:1px}

  .steps{padding:16px 20px}
  .step{display:flex;gap:11px;padding:7px 0;align-items:center;color:var(--muted);font-size:12.5px}
  .stepn{width:22px;height:22px;border-radius:6px;background:var(--cy-soft);color:var(--cy);display:grid;place-items:center;font-weight:700;flex-shrink:0;font-size:11px}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .setrow{padding:14px 18px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .setrow:first-child{border-top:none}
  .toggle{width:40px;height:23px;border-radius:20px;background:var(--panel-3);position:relative;border:1px solid var(--border);transition:.2s;cursor:pointer}
  .toggle.on{background:var(--cy)}
  .toggle::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.2s}
  .toggle.on::after{left:19px}
  .empty{padding:40px 20px;text-align:center;color:var(--faint)}
  .fade{animation:fade .22s ease}
  @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  @media(max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr)}.row,.detail,.fgrid{grid-template-columns:1fr}}
  @media(max-width:720px){.app{grid-template-columns:1fr}.rail{display:none}}
</style>
</head>

    <div class="modal-h"><div class="modal-ico" style="background:var(--green-soft);color:var(--green)">${svg(IC.unlock)}</div><div><h3>${t('unlockTitle')}</h3><p>${t('unlockSub')} · ${d.name}</p></div></div>
    <div class="modal-b"><label style="display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:12.5px"><input type="checkbox" id="ck" style="margin-top:2px;width:15px;height:15px;accent-color:var(--cy)"><span>${t('unlockConfirm')}</span></label></div>
    <div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button><button class="btn btn-cy" id="doUnlock" style="opacity:.5;pointer-events:none">${svg(IC.unlock)}${t('confirmUnlock')}</button></div>
  </div></div>`;
  const ck=document.getElementById('ck'),btn=document.getElementById('doUnlock');
  ck.onchange=()=>{btn.style.opacity=ck.checked?'1':'.5';btn.style.pointerEvents=ck.checked?'auto':'none';};
  btn.onclick=()=>{d.lock='unlocked';AUDIT.unshift({who:'Азиз Каримов',act:'evUnlock',dev:d.name,t:0});closeModal();render();toast(t('toastUnlocked'));};
  document.getElementById('ov').onclick=e=>{if(e.target.id==='ov')closeModal();};
}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}

/* ─── Render ─── */
const TITLES={dashboard:['dashboard','subDash'],devices:['devices','subDevices'],detail:['devices','subDevices'],enroll:['enroll','subEnroll'],audit:['audit','subAudit'],settings:['settings','subSettings']};
function render(){
  renderNav();
  const[tk,sk]=TITLES[route]||TITLES.dashboard;
  document.getElementById('pageTitle').textContent=route==='detail'?currentDevice.name:t(tk);
  document.getElementById('pageSub').textContent=t(sk);
  const v=document.getElementById('view');
  v.innerHTML=({dashboard:viewDashboard,devices:viewDevices,detail:()=>viewDeviceDetail(currentDevice),enroll:viewEnroll,audit:viewAudit,settings:viewSettings}[route])();
  bind();
}
function bind(){
  const v=document.getElementById('view');
  v.querySelectorAll('[data-dev]').forEach(el=>el.onclick=()=>{currentDevice=DEVICES.find(x=>x.id===el.dataset.dev);route='detail';render();});
  v.querySelectorAll('[data-goto]').forEach(el=>el.onclick=()=>{route=el.dataset.goto;render();});
  v.querySelectorAll('[data-filter]').forEach(el=>el.onclick=()=>{deviceFilter=el.dataset.filter;render();});
  v.querySelectorAll('[data-act]').forEach(el=>el.onclick=()=>{const a=el.dataset.act,d=currentDevice;
    if(a==='lock')openLock(d);else if(a==='unlock')openUnlock(d);else if(a==='locate')toast(t('toastLocate'));else if(a==='sound')toast(t('toastSound'));else if(a==='register')toast(t('toastRegistered'));else if(a==='supcheck')toast(t('toastSup'));});
}
/* ─── Lang / theme ─── */
function setLang(l){lang=l;document.documentElement.lang=l;document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));document.getElementById('search').placeholder=lang==='ru'?'/ поиск: клиент · IMEI · договор':'/ qidiruv: mijoz · IMEI · shartnoma';render();}
document.querySelectorAll('#langSeg button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
function toggleTheme(){const r=document.documentElement;r.dataset.theme=r.dataset.theme==='light'?'dark':'light';render();}
document.getElementById('themeBtn').onclick=toggleTheme;
render();
</script>
</body>
</html>

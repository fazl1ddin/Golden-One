<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden One — Управление устройствами</title>
<style>
  :root{
    --bg:#0d0f14; --panel:#161922; --panel-2:#1d212c; --panel-3:#232838;
    --border:#272d3b; --border-2:#333a4d;
    --text:#e8eaf0; --muted:#98a0b3; --faint:#6b7386;
    --gold:#e0bd67; --gold-dim:#b9974a; --gold-soft:rgba(224,189,103,.12);
    --green:#3ecf8e; --green-soft:rgba(62,207,142,.14);
    --amber:#f5b544; --amber-soft:rgba(245,181,68,.14);
    --red:#f2555c; --red-soft:rgba(242,85,92,.15);
    --blue:#5b9bd9; --blue-soft:rgba(91,155,217,.14);
    --radius:14px; --radius-sm:10px;
    --shadow:0 10px 40px rgba(0,0,0,.45);
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  :root[data-theme="light"]{
    --bg:#f4f5f8; --panel:#ffffff; --panel-2:#f7f8fb; --panel-3:#eef0f5;
    --border:#e3e6ee; --border-2:#d6dae6;
    --text:#1a1e29; --muted:#5a6274; --faint:#8b93a6;
    --gold:#b8892a; --gold-dim:#9a7226; --gold-soft:rgba(184,137,42,.12);
    --shadow:0 10px 40px rgba(20,25,40,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:var(--font);
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  ::selection{background:var(--gold-soft)}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:6px}

  .app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}

  /* ── Sidebar ── */
  .side{background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:12px;padding:22px 22px 20px}
  .brand-mark{width:38px;height:38px;border-radius:11px;flex-shrink:0;
    background:linear-gradient(135deg,var(--gold),var(--gold-dim));
    display:grid;place-items:center;color:#1a140a;font-weight:800;font-size:18px;
    box-shadow:0 4px 14px rgba(224,189,103,.3)}
  .brand-name{font-weight:700;font-size:16px;letter-spacing:.2px}
  .brand-sub{font-size:11px;color:var(--faint);letter-spacing:.3px}
  .nav{padding:8px 12px;display:flex;flex-direction:column;gap:2px}
  .nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;
    color:var(--faint);padding:14px 12px 6px;font-weight:600}
  .nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;
    border-radius:var(--radius-sm);color:var(--muted);font-weight:500;
    transition:.15s;position:relative}
  .nav-item svg{width:18px;height:18px;flex-shrink:0}
  .nav-item:hover{background:var(--panel-2);color:var(--text)}
  .nav-item.active{background:var(--gold-soft);color:var(--gold)}
  .nav-item.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;
    width:3px;border-radius:3px;background:var(--gold)}
  .nav-badge{margin-left:auto;background:var(--red-soft);color:var(--red);
    font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px}
  .side-foot{margin-top:auto;padding:14px;border-top:1px solid var(--border)}
  .user{display:flex;align-items:center;gap:11px;padding:8px;border-radius:var(--radius-sm)}
  .user:hover{background:var(--panel-2)}
  .avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(135deg,#454d63,#2c3346);
    display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--text)}
  .user-name{font-size:13px;font-weight:600}
  .user-role{font-size:11px;color:var(--faint)}

  /* ── Main ── */
  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{display:flex;align-items:center;gap:16px;padding:16px 28px;
    border-bottom:1px solid var(--border);background:var(--bg);
    position:sticky;top:0;z-index:20}
  .page-title{font-size:19px;font-weight:700}
  .page-sub{font-size:12.5px;color:var(--muted)}
  .search{flex:1;max-width:380px;margin-left:8px;position:relative}
  .search input{width:100%;background:var(--panel);border:1px solid var(--border);
    color:var(--text);padding:9px 12px 9px 36px;border-radius:var(--radius-sm);
    font-size:13px;outline:none;transition:.15s}
  .search input:focus{border-color:var(--gold-dim);box-shadow:0 0 0 3px var(--gold-soft)}
  .search svg{position:absolute;left:11px;top:9px;width:16px;height:16px;color:var(--faint)}
  .top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
  .seg{display:flex;background:var(--panel);border:1px solid var(--border);
    border-radius:9px;padding:2px}
  .seg button{padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;
    color:var(--muted)}
  .seg button.on{background:var(--gold-soft);color:var(--gold)}
  .icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);
    background:var(--panel);display:grid;place-items:center;color:var(--muted)}
  .icon-btn:hover{color:var(--text);border-color:var(--border-2)}
  .icon-btn svg{width:17px;height:17px}

  .content{padding:24px 28px;flex:1}

  /* ── KPI cards ── */
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
  .kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 20px;position:relative;overflow:hidden}
  .kpi-top{display:flex;align-items:center;justify-content:space-between}
  .kpi-ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
  .kpi-ico svg{width:18px;height:18px}
  .kpi-label{font-size:12.5px;color:var(--muted);margin-top:14px}
  .kpi-val{font-size:28px;font-weight:750;letter-spacing:-.5px;margin-top:2px}
  .kpi-delta{font-size:12px;font-weight:600;margin-top:6px;display:flex;align-items:center;gap:5px}
  .up{color:var(--green)} .down{color:var(--red)}

  /* ── Panels ── */
  .grid-2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius)}
  .panel-h{display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;border-bottom:1px solid var(--border)}
  .panel-h h3{font-size:15px;font-weight:650}
  .panel-b{padding:8px 8px}
  .link{color:var(--gold);font-size:12.5px;font-weight:600}

  /* ── Table ── */
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--faint);font-weight:600;padding:10px 14px}
  td{padding:12px 14px;border-top:1px solid var(--border);font-size:13.5px}
  tbody tr{transition:.12s;cursor:pointer}
  tbody tr:hover{background:var(--panel-2)}
  .cust{display:flex;align-items:center;gap:11px}
  .cust .avatar{width:32px;height:32px;font-size:12px}
  .cust-name{font-weight:600} .cust-meta{font-size:11.5px;color:var(--faint)}
  .mono{font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--muted)}

  .badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;
    font-size:12px;font-weight:600;white-space:nowrap}
  .badge .dot{width:6px;height:6px;border-radius:50%}
  .b-green{background:var(--green-soft);color:var(--green)} .b-green .dot{background:var(--green)}
  .b-amber{background:var(--amber-soft);color:var(--amber)} .b-amber .dot{background:var(--amber)}
  .b-red{background:var(--red-soft);color:var(--red)} .b-red .dot{background:var(--red)}
  .b-blue{background:var(--blue-soft);color:var(--blue)} .b-blue .dot{background:var(--blue)}
  .b-gray{background:var(--panel-3);color:var(--muted)} .b-gray .dot{background:var(--faint)}

  .btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;
    font-size:13px;font-weight:600;transition:.15s;border:1px solid transparent}
  .btn svg{width:16px;height:16px}
  .btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:#1a140a;
    box-shadow:0 4px 14px rgba(224,189,103,.25)}
  .btn-gold:hover{filter:brightness(1.07)}
  .btn-red{background:var(--red);color:#fff}
  .btn-red:hover{filter:brightness(1.08)}
  .btn-ghost{background:var(--panel-2);border-color:var(--border);color:var(--text)}
  .btn-ghost:hover{border-color:var(--border-2);background:var(--panel-3)}
  .btn-danger-ghost{background:var(--red-soft);color:var(--red)}
  .btn-danger-ghost:hover{background:rgba(242,85,92,.22)}

  /* ── Event feed ── */
  .feed{display:flex;flex-direction:column}
  .ev{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--border)}
  .ev:first-child{border-top:none}
  .ev-ico{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:grid;place-items:center}
  .ev-ico svg{width:15px;height:15px}
  .ev-txt{font-size:13px}
  .ev-time{font-size:11.5px;color:var(--faint);margin-top:2px}

  /* ── Filters row ── */
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .chip{padding:7px 13px;border-radius:9px;border:1px solid var(--border);background:var(--panel);
    font-size:12.5px;font-weight:600;color:var(--muted)}
  .chip:hover{color:var(--text)} .chip.on{background:var(--gold-soft);color:var(--gold);
    border-color:transparent}

  /* ── Device detail ── */
  .detail{display:grid;grid-template-columns:1fr 340px;gap:16px}
  .dev-hero{display:flex;gap:18px;align-items:center;padding:22px 24px}
  .phone{width:58px;height:88px;border-radius:12px;flex-shrink:0;
    border:2px solid var(--border-2);background:var(--panel-2);position:relative}
  .phone::before{content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);
    width:22px;height:4px;border-radius:3px;background:var(--border-2)}
  .field{padding:13px 24px;border-top:1px solid var(--border);display:flex;
    justify-content:space-between;align-items:center;gap:12px}
  .field-l{font-size:12.5px;color:var(--muted)}
  .field-v{font-size:13.5px;font-weight:600;text-align:right}
  .action-card{padding:20px 22px}
  .action-card h4{font-size:14px;margin-bottom:4px}
  .action-card p{font-size:12.5px;color:var(--muted);margin-bottom:16px}
  .action-list{display:flex;flex-direction:column;gap:9px}
  .action-list .btn{width:100%;justify-content:center}

  /* ── Modal ── */
  .overlay{position:fixed;inset:0;background:rgba(6,8,12,.66);backdrop-filter:blur(4px);
    display:grid;place-items:center;z-index:100;padding:20px}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:18px;
    width:100%;max-width:460px;box-shadow:var(--shadow);overflow:hidden;
    animation:pop .18s ease}
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-h{padding:20px 24px 0;display:flex;gap:14px;align-items:flex-start}
  .modal-ico{width:44px;height:44px;border-radius:12px;flex-shrink:0;display:grid;place-items:center}
  .modal-ico svg{width:22px;height:22px}
  .modal-h h3{font-size:17px} .modal-h p{font-size:13px;color:var(--muted);margin-top:3px}
  .modal-b{padding:18px 24px}
  .lostpreview{background:#000;border-radius:14px;padding:26px 20px;text-align:center;
    border:1px solid var(--border-2);margin-bottom:16px}
  .lostpreview .lp-lock{width:30px;height:30px;margin:0 auto 12px;color:#fff;opacity:.85}
  .lostpreview .lp-title{color:#fff;font-size:15px;font-weight:600;margin-bottom:8px}
  .lostpreview .lp-msg{color:#c9cdd6;font-size:12.5px;line-height:1.55}
  .lostpreview .lp-phone{color:var(--gold);font-size:14px;font-weight:700;margin-top:10px}
  .form-row{margin-bottom:14px}
  .form-row label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .form-row input,.form-row select,.form-row textarea{width:100%;background:var(--panel-2);
    border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:10px;
    font-size:13.5px;outline:none;font-family:inherit}
  .form-row textarea{resize:vertical;min-height:64px}
  .form-row input:focus,.form-row select:focus,.form-row textarea:focus{
    border-color:var(--gold-dim);box-shadow:0 0 0 3px var(--gold-soft)}
  .modal-f{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;
    justify-content:flex-end;background:var(--panel-2)}
  .warn{display:flex;gap:10px;padding:11px 13px;border-radius:10px;background:var(--amber-soft);
    font-size:12.5px;color:var(--amber);margin-bottom:16px;align-items:flex-start}
  .warn svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}

  .empty{padding:60px 20px;text-align:center;color:var(--faint)}
  .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .set-item{padding:16px 20px;border-top:1px solid var(--border)}
  .set-item:first-child{border-top:none}
  .toggle{width:42px;height:24px;border-radius:20px;background:var(--panel-3);position:relative;
    border:1px solid var(--border);transition:.2s}
  .toggle.on{background:var(--gold)}
  .toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;
    border-radius:50%;background:#fff;transition:.2s}
  .toggle.on::after{left:20px}
  .fade{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .hidden{display:none!important}
  @media(max-width:1080px){.kpi-grid{grid-template-columns:repeat(2,1fr)}
    .grid-2,.detail{grid-template-columns:1fr}.settings-grid{grid-template-columns:1fr}}
  @media(max-width:720px){.app{grid-template-columns:1fr}.side{display:none}}
</style>
</head>

<div class="app">
  <!-- Sidebar -->
  <aside class="side">
    <div class="brand">
      <div class="brand-mark">G1</div>
      <div>
        <div class="brand-name">Golden One</div>
        <div class="brand-sub" data-i="brandSub">Device Control</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="user">
        <div class="avatar">АК</div>
        <div>
          <div class="user-name">Азиз Каримов</div>
          <div class="user-role" data-i="roleCollector">Оператор взыскания</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <div>
        <div class="page-title" id="pageTitle">Дашборд</div>
        <div class="page-sub" id="pageSub"></div>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" placeholder="Поиск по клиенту, IMEI, договору…">
      </div>
      <div class="top-actions">
        <div class="seg" id="langSeg">
          <button data-lang="ru" class="on">RU</button>
          <button data-lang="uz">UZ</button>
        </div>
        <button class="icon-btn" id="themeBtn" title="Тема">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<div id="modalRoot"></div>

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = NAV.map(g=>`
    <div class="nav-label">${t(g.group)}</div>
    ${g.items.map(it=>{
      const badge = it.badge && it.badge()>0 ? `<span class="nav-badge">${it.badge()}</span>`:'';
      return `<a class="nav-item ${route===it.id?'active':''}" data-route="${it.id}">
        ${svg(IC[it.ico])}<span>${t(it.id)}</span>${badge}</a>`;
    }).join('')}

  nav.querySelectorAll('[data-route]').forEach(el=>
    el.onclick=()=>{route=el.dataset.route; render();});
}

/* ─────────────── Helpers ─────────────── */
function loanBadge(s){
  const m={active:['b-green','stActive'],overdue:['b-red','stOverdue'],paid:['b-gray','stPaid']};
  const[c,k]=m[s];return`<span class="badge ${c}"><span class="dot"></span>${t(k)}</span>`;
}
function mdmBadge(s){
  const m={enrolled:['b-blue','stEnrolled'],pending:['b-amber','stPending'],released:['b-gray','stReleased']};
  const[c,k]=m[s];return`<span class="badge ${c}"><span class="dot"></span>${t(k)}</span>`;
}
function lockBadge(s){
  return s==='locked'
    ?`<span class="badge b-red"><span class="dot"></span>${t('lkLocked')}</span>`
    :`<span class="badge b-green"><span class="dot"></span>${t('lkUnlocked')}</span>`;
}
function toast(msg){
  const el=document.createElement('div');
  el.style.cssText=`position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--panel-3);border:1px solid var(--border-2);color:var(--text);
    padding:12px 20px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:200;
    box-shadow:var(--shadow);display:flex;gap:9px;align-items:center;animation:fade .2s`;
  el.innerHTML=`<span style="color:var(--green)">${svg(IC.check)}</span>${msg}`;
  el.querySelector('svg').style.cssText='width:17px;height:17px';
  document.body.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='.3s';setTimeout(()=>el.remove(),300);},2200);
}

function fmtAgo(sec){
  if(sec<60)return t('now');
  if(sec<3600)return Math.floor(sec/60)+' '+t('min')+' '+t('ago');
  return Math.floor(sec/3600)+' '+t('hr')+' '+t('ago');
}

      <td><div class="cust"><div class="avatar" style="width:30px;height:30px;font-size:11px">${a.who.split(' ').map(x=>x[0]).join('')}</div>
        <span class="cust-name">${a.who}</span></div></td>
      <td>${t(a.act)}</td><td>${a.dev}</td><td class="cust-meta">${fmtAgo(a.t)}</td>
    </tr>`).join('')}
    </tbody></table>
  </div></div></div>`;
}

  return `<div class="fade"><div class="settings-grid">
    <div class="panel">
      <div class="panel-h"><h3>${t('setMdm')}</h3></div>
      <div class="set-item" style="display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-weight:600">${t('setProvider')}</div><div class="cust-meta">Mosyle Business</div></div>
        <span class="badge b-gray">API</span></div>
      <div class="set-item" style="display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-weight:600">${t('setStatus')}</div><div class="cust-meta mono">api.mosyle.com</div></div>
        <span class="badge b-green"><span class="dot"></span>${t('connected')}</span></div>
    </div>
    <div class="panel">
      <div class="panel-h"><h3>${t('setRoles')}</h3></div>
      <div class="set-item" style="display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-weight:600">${t('setLang')}</div><div class="cust-meta">RU / UZ</div></div>
        <div class="seg"><button class="${lang==='ru'?'on':''}" onclick="setLang('ru')">RU</button><button class="${lang==='uz'?'on':''}" onclick="setLang('uz')">UZ</button></div></div>
      <div class="set-item" style="display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-weight:600">${t('setTheme')}</div><div class="cust-meta">Dark / Light</div></div>
        <div class="toggle ${document.documentElement.dataset.theme!=='light'?'on':''}" onclick="toggleTheme()"></div></div>
    </div>
    <div class="panel" style="grid-column:1/-1">
      <div class="panel-h"><h3>${t('setTemplate')}</h3></div>
      <div style="padding:18px 20px">
        <div class="form-row"><label>${t('lockMsgLabel')}</label>
          <textarea>Устройство заблокировано в связи с просрочкой платежа. Для разблокировки обратитесь в Golden One.</textarea></div>
        <div class="form-row"><label>${t('lockPhoneLabel')}</label><input value="+998 71 200-00-00"></div>
      </div>
    </div>
  </div></div>`;
}

/* ─────────────── Modals ─────────────── */
function openLock(d){
  const root=document.getElementById('modalRoot');
  root.innerHTML=`<div class="overlay" id="ov">
    <div class="modal">
      <div class="modal-h">
        <div class="modal-ico" style="background:var(--red-soft);color:var(--red)">${svg(IC.lock)}</div>
        <div><h3>${t('lockTitle')}</h3><p>${t('lockSub')} · ${d.name}</p></div>
      </div>
      <div class="modal-b">
        <div class="warn">${svg(IC.warn)}<span>${t('lockWarn')}</span></div>
        <div class="form-row"><label>${t('lockReason')}</label>
          <select><option>${t('reasonOverdue')}</option><option>${t('reasonFraud')}</option><option>${t('reasonOther')}</option></select></div>
        <div class="form-row"><label>${t('lockMsgLabel')}</label>
          <textarea id="lockMsg">Устройство заблокировано в связи с просрочкой платежа. Для разблокировки обратитесь в Golden One.</textarea></div>
        <div class="form-row"><label>${t('lockPhoneLabel')}</label><input id="lockPhone" value="+998 71 200-00-00"></div>
        <div class="lostpreview">
          <div class="lp-lock">${svg(IC.lock)}</div>
          <div class="lp-title">${t('previewTitle')}</div>
          <div class="lp-msg" id="prevMsg">Устройство заблокировано в связи с просрочкой платежа.</div>
          <div class="lp-phone" id="prevPhone">+998 71 200-00-00</div>
        </div>
      </div>
      <div class="modal-f">
        <button class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>
        <button class="btn btn-red" id="doLock">${svg(IC.lock)}${t('confirmLock')}</button>
      </div>
    </div></div>`;
  const msg=document.getElementById('lockMsg'), ph=document.getElementById('lockPhone');
  const sync=()=>{document.getElementById('prevMsg').textContent=msg.value;
    document.getElementById('prevPhone').textContent=ph.value;};
  msg.oninput=sync; ph.oninput=sync;
  document.getElementById('doLock').onclick=()=>{
    d.lock='locked'; AUDIT.unshift({who:'Азиз Каримов',act:'evLock',dev:d.name,t:0});
    closeModal(); render(); toast(t('toastLocked'));
  };
  document.getElementById('ov').onclick=e=>{if(e.target.id==='ov')closeModal();};
}
function openUnlock(d){
  const root=document.getElementById('modalRoot');
  root.innerHTML=`<div class="overlay" id="ov">
    <div class="modal">
      <div class="modal-h">
        <div class="modal-ico" style="background:var(--green-soft);color:var(--green)">${svg(IC.unlock)}</div>
        <div><h3>${t('unlockTitle')}</h3><p>${t('unlockSub')} · ${d.name}</p></div>
      </div>
      <div class="modal-b">
        <label style="display:flex;gap:11px;align-items:flex-start;padding:13px;border:1px solid var(--border);
          border-radius:12px;cursor:pointer;font-size:13px">
          <input type="checkbox" id="ck" style="margin-top:2px;width:16px;height:16px;accent-color:var(--gold)">
          <span>${t('unlockConfirm')}</span></label>
      </div>
      <div class="modal-f">
        <button class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>
        <button class="btn btn-gold" id="doUnlock" style="opacity:.5;pointer-events:none">${svg(IC.unlock)}${t('confirmUnlock')}</button>
      </div>
    </div></div>`;
  const ck=document.getElementById('ck'), btn=document.getElementById('doUnlock');
  ck.onchange=()=>{btn.style.opacity=ck.checked?'1':'.5';btn.style.pointerEvents=ck.checked?'auto':'none';};
  btn.onclick=()=>{d.lock='unlocked'; AUDIT.unshift({who:'Азиз Каримов',act:'evUnlock',dev:d.name,t:0});
    closeModal(); render(); toast(t('toastUnlocked'));};
  document.getElementById('ov').onclick=e=>{if(e.target.id==='ov')closeModal();};
}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}

/* ─────────────── Render ─────────────── */
const TITLES={dashboard:['dashboard','subDash'],devices:['devices','subDevices'],
  enroll:['enroll','subEnroll'],audit:['audit','subAudit'],settings:['settings','subSettings'],
  detail:['devices','subDevices']};
function render(){
  renderNav();
  const [tk,sk]=TITLES[route]||TITLES.dashboard;
  document.getElementById('pageTitle').textContent=route==='detail'?currentDevice.name:t(tk);
  document.getElementById('pageSub').textContent=t(sk);
  const v=document.getElementById('view');
  if(route==='dashboard')v.innerHTML=viewDashboard();
  else if(route==='devices')v.innerHTML=viewDevices();
  else if(route==='detail')v.innerHTML=viewDeviceDetail(currentDevice);
  else if(route==='enroll')v.innerHTML=viewEnroll();
  else if(route==='audit')v.innerHTML=viewAudit();
  else if(route==='settings')v.innerHTML=viewSettings();
  bind();
}
function bind(){
  const v=document.getElementById('view');
  v.querySelectorAll('[data-dev]').forEach(el=>el.onclick=()=>{
    currentDevice=DEVICES.find(x=>x.id===el.dataset.dev); route='detail'; render();});
  v.querySelectorAll('[data-goto]').forEach(el=>el.onclick=()=>{route=el.dataset.goto; render();});
  v.querySelectorAll('[data-filter]').forEach(el=>el.onclick=()=>{deviceFilter=el.dataset.filter; render();});
  v.querySelectorAll('[data-act]').forEach(el=>el.onclick=()=>{
    const a=el.dataset.act, d=currentDevice;
    if(a==='lock')openLock(d);
    else if(a==='unlock')openUnlock(d);
    else if(a==='locate')toast(t('toastLocate'));
    else if(a==='sound')toast(t('toastSound'));
    else if(a==='register')toast(t('toastRegistered'));
  });
}

/* ─────────────── Language / theme ─────────────── */
function setLang(l){lang=l; document.documentElement.lang=l;
  document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.getElementById('search').placeholder=lang==='ru'?'Поиск по клиенту, IMEI, договору…':'Mijoz, IMEI, shartnoma bo‘yicha qidirish…';
  render();}
document.querySelectorAll('#langSeg button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
function toggleTheme(){
  const r=document.documentElement;
  r.dataset.theme = r.dataset.theme==='light'?'dark':'light';
  render();
}
document.getElementById('themeBtn').onclick=toggleTheme;

/* init */
render();
</script>
